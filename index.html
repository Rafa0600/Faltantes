<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe600">
<title>Faltantes</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#f2f3f5; --card:#fff; --tx:#1d1d1f; --mut:#6b7280; --bd:#e6e8eb; --az:#3483fa; --ok:#2e7d32; --mal:#c62828; --am:#ffe600; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { background:var(--am); padding:10px 16px; display:flex; align-items:center; gap:8px; position:sticky; top:0; z-index:5; }
  header b { font-size:18px; flex:1; }
  header button { border:0; background:rgba(0,0,0,.08); border-radius:8px; padding:6px 10px; font:600 13px system-ui,sans-serif; color:#1d1d1f; }
  main { max-width:600px; margin:0 auto; padding:12px 16px 90px; }
  button { cursor:pointer; }
  .foto-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:0; border-radius:14px; padding:18px;
    background:var(--az); color:#fff; font:700 18px system-ui,sans-serif; box-shadow:0 2px 6px rgba(52,131,250,.35); }
  .mini { display:flex; gap:8px; margin-top:8px; }
  .mini label, .mini button { flex:1; text-align:center; border:1px solid var(--bd); background:#fff; border-radius:10px; padding:9px; font:600 14px system-ui,sans-serif; color:var(--tx); cursor:pointer; }
  #fotos { display:flex; gap:8px; overflow-x:auto; margin-top:10px; }
  #fotos:empty { display:none; }
  .th { position:relative; flex:0 0 auto; width:54px; height:72px; border-radius:8px; overflow:hidden; border:1px solid var(--bd); background:#ddd; }
  .th img { width:100%; height:100%; object-fit:cover; display:block; }
  .th span { position:absolute; right:2px; bottom:2px; background:rgba(0,0,0,.7); color:#fff; font:700 11px system-ui; padding:1px 5px; border-radius:6px; }
  .th.leyendo::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,.55); }
  #estado { font-size:13px; color:var(--mut); margin-top:8px; min-height:18px; }
  #estado.mal { color:var(--mal); }
  .barra { height:4px; background:#e5e7eb; border-radius:2px; overflow:hidden; margin-top:4px; display:none; }
  .barra div { height:100%; width:0; background:var(--az); transition:width .2s; }
  .card { background:var(--card); border-radius:14px; padding:12px 14px; margin-top:12px; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .resumen { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { color:#fff; border-radius:16px; padding:5px 11px; font:700 13px system-ui,sans-serif; white-space:nowrap; }
  .chip b { font-weight:800; margin-left:4px; }
  .tit { font-size:12px; font-weight:700; color:var(--mut); text-transform:uppercase; margin:12px 0 2px; display:flex; gap:6px; align-items:center; }
  .tit i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .fila { display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--bd); }
  .tit + .fila { border-top:0; }
  .fila .n { font:600 15px ui-monospace,Consolas,monospace; flex:1; }
  .fila .h { font-size:13px; color:var(--mut); white-space:nowrap; }
  .fila .h b { color:var(--tx); }
  .fila.no .h { color:var(--mal); }
  .fila.dud { background:#fff4e5; margin:0 -14px; padding:7px 14px; }
  .fila.dud .n { color:#e65100; text-decoration:underline dotted; }
  .fila .si { border:0; background:#e65100; color:#fff; border-radius:8px; padding:4px 8px; font:700 12px system-ui,sans-serif; }
  .fila .n { cursor:pointer; }
  .fila .x { border:0; background:#e8f5e9; color:#2e7d32; border-radius:8px; padding:5px 8px; font:700 12px system-ui,sans-serif; white-space:nowrap; }
  #deshacer { white-space:nowrap; max-width:92vw; position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom)); background:#263238; color:#fff; border-radius:12px; padding:10px 14px; display:none; gap:12px; align-items:center; z-index:15; font-size:14px; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  #deshacer button { border:0; background:none; color:#ffe600; font:700 14px system-ui,sans-serif; }
  .vacio { color:var(--mut); text-align:center; padding:14px 0 4px; font-size:14px; }
  .pie { position:fixed; left:0; right:0; bottom:0; background:rgba(242,243,245,.96); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; justify-content:center; border-top:1px solid var(--bd); }
  .pie button { max-width:290px; flex:1; border:0; border-radius:12px; padding:13px; font:700 15px system-ui,sans-serif; }
  .pie .ok { background:var(--ok); color:#fff; }
  .pie .gris { background:#e3e5e8; color:var(--tx); max-width:130px; }
  #grande { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:20; display:none; align-items:center; justify-content:center; }
  #grande img { max-width:100%; max-height:100%; }
  #grande button { position:absolute; top:12px; border:0; border-radius:20px; padding:8px 14px; font:700 14px system-ui,sans-serif; }
</style>
</head>
<body>
<header><b>📦 Faltantes</b><button id="instalar" hidden>⬇ Instalar</button><button id="cfg" title="Clave">⚙</button></header>
<main>
  <label class="foto-btn">📷 Sacar foto<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
  <div class="mini">
    <label>🖼 Galería<input id="gal" type="file" accept="image/*" multiple hidden></label>
    <button id="escribir">⌨ Escribir número</button>
  </div>
  <div id="fotos"></div>
  <div id="estado"></div>
  <div class="barra" id="barra"><div></div></div>
  <div class="card" id="res"><div class="vacio">Sacale foto a la lista de faltantes. Podés sacar varias: los números repetidos no se suman dos veces.</div></div>
</main>
<div class="pie"><button class="gris" id="nueva">🗑 Borrar todo</button><button class="ok" id="compartir">📤 Compartir</button></div>
<div id="deshacer"><span></span><button>Deshacer</button></div>
<div id="grande"><img alt=""><button id="borrarFoto" style="left:12px;background:#c62828;color:#fff">🗑 Quitar foto</button><button id="cerrarG" style="right:12px;background:#fff">✕ Cerrar</button></div>

<script>
const API = 'https://mikra-historial.rafaelassir.workers.dev/api/prov';
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// el repo es público: la clave NO va en el código; se pide una vez y queda guardada en el celu
const clave = () => ls.get('flt-clave', '');
let NUMS = ls.get('flt-nums', []);          // envíos y devoluciones, en orden
let INFO = ls.get('flt-info', {});          // id → {t, r, prov} de la nube
let FOTOS = ls.get('flt-fotos', []);        // [{src (jpg chico), n}]
let DUD = ls.get('flt-dud', []);            // leídos en una sola lectura: a revisar con la foto
let AGREG = ls.get('flt-agreg', {});        // id → cuándo se anotó (de la nube)
// La LISTA vive en la nube (igual en todos los celus). Lo que se cambia sin conexión queda en "pend" y se manda después.
const API_LISTA = 'https://mikra-historial.rafaelassir.workers.dev/api/places/flt';
let PEND = ls.get('flt-pend', { agregar: [], quitar: [], seguro: [] });
let SYNC = { ok: 0, err: '' };
function encolar(tipo, items) {
  for (const it of items) {
    const id = typeof it === 'string' ? it : it.id;
    if (tipo === 'agregar') { PEND.quitar = PEND.quitar.filter(x => x !== id); if (!PEND.agregar.some(x => x.id === id)) PEND.agregar.push(it); }
    if (tipo === 'quitar') { PEND.agregar = PEND.agregar.filter(x => x.id !== id); PEND.seguro = PEND.seguro.filter(x => x !== id); if (!PEND.quitar.includes(id)) PEND.quitar.push(id); }
    if (tipo === 'seguro' && !PEND.seguro.includes(id)) PEND.seguro.push(id);
  }
  ls.set('flt-pend', PEND);
  sincronizar();
}
let sincronizando = null, vaciarPend = false;
function sincronizar() {
  if (sincronizando) return sincronizando.then(() => sincronizar());
  return sincronizando = (async () => {
    if (!clave()) return;
    const body = { agregar: [...PEND.agregar], quitar: [...PEND.quitar], seguro: [...PEND.seguro], vaciar: vaciarPend || undefined };
    const hay = vaciarPend || PEND.agregar.length || PEND.quitar.length || PEND.seguro.length;
    try {
      const r = await fetch(API_LISTA, { method: hay ? 'POST' : 'GET', headers: { 'X-Clave': clave(), 'Content-Type': 'application/json' }, body: hay ? JSON.stringify(body) : undefined });
      if (r.status === 401) { ls.set('flt-clave', ''); throw new Error('Clave incorrecta. Tocá ⚙ y ponela de nuevo.'); }
      const j = await r.json(); if (!j.ok) throw new Error(j.error || 'error');
      // lo mandado ya está en la nube: se saca de pendientes (lo que se agregó mientras tanto queda)
      PEND.agregar = PEND.agregar.filter(x => !body.agregar.some(y => y.id === x.id));
      PEND.quitar = PEND.quitar.filter(x => !body.quitar.includes(x));
      PEND.seguro = PEND.seguro.filter(x => !body.seguro.includes(x));
      if (body.vaciar) vaciarPend = false;
      ls.set('flt-pend', PEND);
      const antes = NUMS.join();
      AGREG = {}; j.lista.forEach(x => { AGREG[x.id] = x.agregado; });
      NUMS = j.lista.map(x => x.id).filter(id => !PEND.quitar.includes(id)).concat(PEND.agregar.map(x => x.id).filter(id => !AGREG[id]));
      DUD = j.lista.filter(x => x.dud && !PEND.seguro.includes(x.id)).map(x => x.id).concat(PEND.agregar.filter(x => x.dud).map(x => x.id));
      SYNC = { ok: Date.now(), err: '' };
      guardar();
      if (NUMS.join() !== antes) { pintar(); if (NUMS.some(n => !(INFO[n] || {}).t)) buscar(); } else pintarSync();
    } catch (e) { SYNC.err = e.message === 'Failed to fetch' ? 'sin conexión' : e.message; pintarSync(); }
    finally { sincronizando = null; }
  })();
}
function pintarSync() {
  const el = $('#sync'); if (!el) return;
  const pend = PEND.agregar.length + PEND.quitar.length + PEND.seguro.length;
  el.textContent = SYNC.err ? '⚠ ' + SYNC.err + (pend ? ' · ' + pend + ' cambio' + (pend === 1 ? '' : 's') + ' sin subir' : '')
    : pend ? '☁ Subiendo…' : SYNC.ok ? '☁ Igual en todos los celus' : '';
  el.style.color = SYNC.err ? 'var(--mal)' : 'var(--mut)';
}
const esValido = (n) => /^4\d{10}$/.test(n) || /^M\d{10}MLA$/.test(n);
const esDev = (n) => n[0] === 'M';

/* ---------- texto → números ---------- */
function extraer(txt) {
  // letras que el lector confunde dentro de números (O→0, l/I/|→1, S→5, B→8)
  const t = String(txt)
    .replace(/(?<=\d)[OoQD]|[OoQD](?=\d)/g, '0').replace(/(?<=\d)[lI|]|[lI|](?=\d)/g, '1')
    .replace(/(?<=\d)S|S(?=\d)/g, '5').replace(/(?<=\d)B|B(?=\d)/g, '8');
  const out = [];
  for (const linea of t.split(/\n/)) {
    // devolución: "M0009695745MLA" (el MLA a veces sale mal: se toman los 10 dígitos después de la M)
    const dv = linea.match(/[MN]\s*(0[\d\s]{9,14})/);
    if (dv) { const d = dv[1].replace(/\s/g, '').slice(0, 10); if (d.length === 10) out.push('M' + d + 'MLA'); }
    // envío: pedazos de dígitos seguidos que suman justo 11 ("48517 745499"); así "48481280636 16 nov"
    // no se pega con el 16 de la fecha
    const g = linea.replace(/[MN]\s*0[\d\s]{9,14}\S*/, ' ').split(/[^\d]+/).filter(Boolean);
    for (let i = 0; i < g.length; i++) {
      if (g[i].length === 12) { out.push(g[i].slice(1)); continue; }   // el "#" leído como 7 / 4 / 1
      if (g[i].length > 12 && g[i].length % 11 === 0) { for (let k = 0; k < g[i].length; k += 11) out.push(g[i].slice(k, k + 11)); continue; }
      let s = '';
      for (let j = i; j < g.length && s.length < 11; j++) {
        s += g[j];
        if (s.length === 11) { out.push(s); i = j; break; }
      }
    }
  }
  return [...new Set(out)].filter(esValido);
}

/* ---------- foto → texto (Tesseract, en el mismo celu) ---------- */
function estado(t, mal, pct) {
  $('#estado').textContent = t || ''; $('#estado').className = mal ? 'mal' : '';
  $('#barra').style.display = pct == null ? 'none' : 'block';
  if (pct != null) $('#barra div').style.width = Math.round(pct * 100) + '%';
}
let tesseractListo = null;
function cargarTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (!tesseractListo) tesseractListo = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = res; s.onerror = () => { tesseractListo = null; rej(new Error('No se pudo cargar el lector (¿sin internet?)')); };
    document.head.appendChild(s);
  });
  return tesseractListo;
}
function abrirImagen(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('No pude abrir la imagen'));
    img.src = URL.createObjectURL(file);
  });
}
function variante(img, filtro, escala) {
  const k = Math.min(escala, 2400 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const g = c.getContext('2d'); g.filter = filtro; g.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
// ¿el mismo número mal leído en otra pasada? (difieren en 1 solo carácter)
const casiIgual = (a, b) => { if (a.length !== b.length) return false; let d = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i] && ++d > 1) return false; return d === 1; };
let worker = null, cola = Promise.resolve();
async function leerUna(file, iFoto, nFotos) {
  const img = await abrirImagen(file);
  const chica = variante(img, 'none', 1000 / Math.max(img.width, img.height));      // para ver después
  FOTOS.push({ src: chica.toDataURL('image/jpeg', 0.75), n: 0, leyendo: true });
  pintarFotos();
  await cargarTesseract();
  if (!worker) worker = await Tesseract.createWorker('eng', 1, {
    logger: (m) => { if (m.status === 'recognizing text') estado(leyendoTxt, false, (paso + m.progress) / PASADAS.length); },
  });
  // 4 lecturas distintas (2 normales + 2 que solo aceptan números, # y MLA) y se VOTA:
  // un número cuenta como seguro solo si salió igual en 2 o más lecturas
  const vistos = new Map();
  let soloNums = false;
  for (paso = 0; paso < PASADAS.length; paso++) {
    leyendoTxt = 'Leyendo foto' + (nFotos > 1 ? ' ' + (iFoto + 1) + ' de ' + nFotos : '') + '…';
    const [f, e, w] = PASADAS[paso];
    if (!!w !== soloNums) { soloNums = !!w; await worker.setParameters({ tessedit_char_whitelist: w ? '0123456789#MLA' : '' }); }
    const { data } = await worker.recognize(variante(img, f, e));
    extraer(data.text).forEach(n => vistos.set(n, (vistos.get(n) || 0) + 1));
  }
  if (soloNums) await worker.setParameters({ tessedit_char_whitelist: '' });
  // lecturas parecidas (hasta 2 caracteres distintos) = el mismo número mal leído: gana el más votado
  const orden = [...vistos.keys()], grupos = [];
  for (const [n, v] of [...vistos.entries()].sort((a, b) => b[1] - a[1])) {
    const g = grupos.find(x => distancia(x.n, n) <= 2);
    if (g) g.votos += v; else grupos.push({ n, votos: v, propio: v });
  }
  const l = [], dudosos = [];
  orden.forEach(n => { const g = grupos.find(x => x.n === n); if (!g) return; l.push(n); if (g.propio < 2) dudosos.push(n); });
  const foto = FOTOS[FOTOS.length - 1];
  foto.leyendo = false; foto.n = l.length; foto.ids = l;
  return { l, dudosos };
}
const distancia = (a, b) => { if (a.length !== b.length) return 99; let d = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) d++; return d; };
const PASADAS = [
  ['grayscale(1) contrast(1.6) brightness(1.05)', 2],
  ['none', 1],
  ['grayscale(1) contrast(1.6) brightness(1.05)', 2, true],
  ['grayscale(1) contrast(2.4) brightness(1.15)', 2.4, true],
];
// un envío cuyo comienzo no se parece a ningún otro de la lista (ej. 41… o 49… entre todos 48…) → a revisar
function rarosPorPrefijo() {
  const env = NUMS.filter(n => !esDev(n));
  if (env.length < 3) return [];
  return env.filter(n => !env.some(x => x !== n && x.slice(0, 2) === n.slice(0, 2)));
}
let paso = 0, leyendoTxt = '';
function leerFotos(files) {
  files = [...files]; if (!files.length) return;
  cola = cola.then(async () => {
    // una lista de hace más de 2 horas es de otra colecta: se empieza de cero (si no, se mezclaban)
    const aviso = '';
    let nuevos = 0, leidos = 0; const agregados = [];
    for (let i = 0; i < files.length; i++) {
      try {
        const { l, dudosos } = await leerUna(files[i], i, files.length);
        leidos += l.length;
        for (const x of l) if (!NUMS.includes(x)) { NUMS.push(x); nuevos++; if (dudosos.includes(x)) DUD.push(x); agregados.push({ id: x, dud: dudosos.includes(x) ? 1 : 0 }); }
        // si en esta foto salió seguro, deja de ser dudoso
        DUD = DUD.filter(x => !(l.includes(x) && !dudosos.includes(x)));
      } catch (e) { estado('⚠ ' + e.message, true); }
    }
    rarosPorPrefijo().forEach(n => { if (!DUD.includes(n)) { DUD.push(n); const a = agregados.find(x => x.id === n); if (a) a.dud = 1; } });
    guardar(); pintarFotos();
    if (agregados.length) encolar('agregar', agregados);
    if (!leidos) { estado(aviso + '⚠ No encontré números. Probá otra foto más cerca y sin reflejo, o escribilo.', true); pintar(); return; }
    estado(aviso + '✓ ' + nuevos + ' nuevo' + (nuevos === 1 ? '' : 's') + (leidos > nuevos ? ' · ' + (leidos - nuevos) + ' ya estaban' : '') + ' · buscando…');
    await buscar();
  });
}
$('#cam').onchange = (e) => { leerFotos(e.target.files); e.target.value = ''; };
$('#gal').onchange = (e) => { leerFotos(e.target.files); e.target.value = ''; };

/* ---------- fotos chiquitas: tocar = verla grande ---------- */
let fotoAbierta = -1;
function pintarFotos() {
  $('#fotos').innerHTML = FOTOS.map((f, i) => '<div class="th' + (f.leyendo ? ' leyendo' : '') + '" data-f="' + i + '"><img src="' + f.src + '" alt=""><span>' + (f.leyendo ? '…' : f.n) + '</span></div>').join('');
}
$('#fotos').onclick = (e) => {
  const t = e.target.closest('[data-f]'); if (!t) return;
  fotoAbierta = +t.dataset.f; $('#grande img').src = FOTOS[fotoAbierta].src; $('#grande').style.display = 'flex';
};
$('#cerrarG').onclick = () => { $('#grande').style.display = 'none'; };
$('#grande').onclick = (e) => { if (e.target.id === 'grande') $('#grande').style.display = 'none'; };
$('#borrarFoto').onclick = () => {
  const f = FOTOS[fotoAbierta]; if (!f) return;
  // saca los números que vinieron SOLO de esta foto
  const deOtras = new Set(FOTOS.filter((_, i) => i !== fotoAbierta).flatMap(x => x.ids || []));
  const quitar = (f.ids || []).filter(n => !deOtras.has(n));
  if (!confirm('¿Quitar esta foto' + (quitar.length ? ' y sus ' + quitar.length + ' número' + (quitar.length === 1 ? '' : 's') : '') + '?')) return;
  NUMS = NUMS.filter(n => !quitar.includes(n)); DUD = DUD.filter(n => !quitar.includes(n));
  FOTOS.splice(fotoAbierta, 1); guardar(); if (quitar.length) encolar('quitar', quitar);
  $('#grande').style.display = 'none'; pintarFotos(); pintar();
};

/* ---------- a mano ---------- */
$('#escribir').onclick = async () => {
  const v = prompt('Número de envío (11 dígitos) o devolución (M000…MLA). Podés pegar varios:');
  if (!v) return;
  const l = extraer(v.replace(/(\d)\s+(?=\d)/g, '$1'));
  if (!l.length) { estado('⚠ No es un número de envío válido.', true); return; }
  const nv = l.filter(x => !NUMS.includes(x)); NUMS.push(...nv); const n = nv.length;
  guardar(); if (nv.length) encolar('agregar', nv.map(id => ({ id, dud: 0 }))); estado('✓ ' + n + ' agregado' + (n === 1 ? '' : 's') + ' · buscando…'); await buscar();
};

/* ---------- nube ---------- */
function pedirClave(msg) {
  const k = prompt(msg || 'Clave de la nube (la misma del Lector QR de Places). Se pide una sola vez:');
  if (k && k.trim()) { ls.set('flt-clave', k.trim()); return true; }
  return false;
}
$('#cfg').onclick = () => { if (pedirClave('Cambiar la clave de la nube:')) { sincronizar(); buscar(); } };
async function buscar() {
  const ids = NUMS.filter(n => !INFO[n] || !INFO[n].t);   // lo que ya tiene hora no se vuelve a pedir
  if (!NUMS.length) { pintar(); return; }
  if (!clave() && !pedirClave()) { estado('Sin la clave no puedo buscar la hora y el proveedor.', true); pintar(); return; }
  try {
    for (let i = 0; i < ids.length; i += 150) {
      const r = await fetch(API + '?ids=' + ids.slice(i, i + 150).join(','), { headers: { 'X-Clave': clave() } });
      if (r.status === 401) { ls.set('flt-clave', ''); throw new Error('Clave incorrecta. Tocá ⚙ y ponela de nuevo.'); }
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'error');
      Object.assign(INFO, j.envios);
    }
    guardar(); estado('');
  } catch (e) { estado('⚠ ' + (e.message === 'Failed to fetch' ? 'Sin conexión' : e.message), true); }
  pintar();
}

/* ---------- resultado: resumen por proveedor + lista agrupada ---------- */
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'], MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const hhmm = (t) => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function diaTxt(t) {
  const d = new Date(t), h = new Date(); h.setHours(0, 0, 0, 0);
  const d0 = new Date(d); d0.setHours(0, 0, 0, 0);
  const n = Math.round((h - d0) / 86400000);
  return n === 0 ? 'Hoy' : n === 1 ? 'Ayer' : DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MES[d.getMonth()];
}
function colorProv(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return 'hsl(' + h + ',55%,40%)'; }
const NOFIG = 'No figura', DEVS = 'Devoluciones', REV = '⚠ Revisar';
function grupoDe(n) { if (DUD.includes(n)) return REV; const x = INFO[n] || {}; return x.prov || (esDev(n) ? DEVS : x.t ? 'Sin proveedor' : NOFIG); }
const colorDe = (g) => g === REV ? '#e65100' : g === NOFIG ? '#c62828' : g === DEVS ? '#8d6e63' : g === 'Sin proveedor' ? '#78909c' : colorProv(g);
function grupos() {
  const m = new Map();
  for (const n of NUMS) { const g = grupoDe(n); if (!m.has(g)) m.set(g, []); m.get(g).push(n); }
  const ult = (g) => g === REV ? -1 : g === NOFIG ? 3 : g === DEVS ? 2 : g === 'Sin proveedor' ? 1 : 0;
  return [...m.entries()].sort((a, b) => ult(a[0]) - ult(b[0]) || b[1].length - a[1].length)
    .map(([g, l]) => [g, l.sort((a, b) => ((INFO[b] || {}).t || 0) - ((INFO[a] || {}).t || 0))]);
}
function pintar() {
  if (!NUMS.length) { $('#res').innerHTML = '<div class="vacio">' + (SYNC.ok ? '🎉 No queda nada para reclamar.<br>' : '') + 'Sacale foto a la lista de faltantes. Podés sacar varias: los números repetidos no se suman dos veces.</div><div id="sync" style="font-size:12px;text-align:center;margin-top:6px"></div>'; pintarSync(); return; }
  const gs = grupos();
  $('#res').innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b style="font-size:30px;line-height:1">' + NUMS.length + '</b>' +
      '<div style="flex:1;line-height:1.2"><b style="font-size:16px">para reclamar</b><div id="sync" style="font-size:12px"></div></div></div>' +
    '<div class="resumen">' + gs.map(([g, l]) => '<span class="chip" style="background:' + colorDe(g) + '">' + esc(g) + '<b>' + l.length + '</b></span>').join('') + '</div>' +
    gs.map(([g, l]) => '<div class="tit"><i style="background:' + colorDe(g) + '"></i>' + esc(g) + ' · ' + l.length + '</div>' +
      l.map(n => { const x = INFO[n] || {};
        const dud = DUD.includes(n);
        return '<div class="fila' + (x.t ? '' : ' no') + (dud ? ' dud' : '') + '"><span class="n" data-ed="' + n + '">' + n +
          (AGREG[n] ? '<small style="display:block;font:500 11px system-ui,sans-serif;color:var(--mut)">anotado ' + diaTxt(AGREG[n]).toLowerCase() + '</small>' : '') + '</span>' +
          (dud ? '<button class="si" data-si="' + n + '">✓ Está bien</button>' : '') + '<span class="h">' +
          (x.t ? '<b>' + diaTxt(x.t) + '</b> ' + hhmm(x.t) : x.prov ? 'sin hora' : 'no escaneado') +
          '</span><button class="x" data-x="' + n + '" title="Ya llegó: sacar de la lista">✓ Llegó</button></div>'; }).join('')).join('');
  pintarSync();
}
$('#res').onclick = async (e) => {
  const d = e.target.dataset;
  if (d.x) {                                        // llegó: sale de la lista (en todos los celus), con deshacer
    const id = d.x, eraDud = DUD.includes(id);
    NUMS = NUMS.filter(x => x !== id); guardar(); pintar(); encolar('quitar', [id]);
    const t = $('#deshacer'); t.querySelector('span').textContent = '✓ …' + id.slice(-4) + ' llegó · quedan ' + NUMS.length;
    t.style.display = 'flex'; clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 6000);
    t.querySelector('button').onclick = () => { t.style.display = 'none'; NUMS.push(id); if (eraDud) DUD.push(id); guardar(); pintar(); encolar('agregar', [{ id, dud: eraDud ? 1 : 0 }]); };
    return;
  }
  if (d.si) { DUD = DUD.filter(x => x !== d.si); guardar(); pintar(); encolar('seguro', [d.si]); return; }
  if (d.ed) {                                       // tocar el número = corregirlo
    const v = prompt('Corregí el número (mirá la foto):', d.ed);
    if (v == null) return;
    const l = extraer(v.replace(/\s/g, ''));
    if (!l.length) { alert('No es un número válido (11 dígitos que empiezan con 4, o M + 10 dígitos + MLA).'); return; }
    const i = NUMS.indexOf(d.ed);
    const nuevos = l.filter(x => !NUMS.includes(x) || x === d.ed);
    NUMS.splice(i, 1, ...nuevos);
    DUD = DUD.filter(x => x !== d.ed); delete INFO[d.ed];
    guardar(); pintar();
    if (!nuevos.includes(d.ed)) encolar('quitar', [d.ed]);
    encolar('agregar', nuevos.filter(x => x !== d.ed).map(id => ({ id, dud: 0 })));
    if (nuevos.includes(d.ed)) encolar('seguro', [d.ed]);
    await buscar();
  }
};
function textoCompartir() {
  return '📦 Faltantes para reclamar: ' + NUMS.length + '\n' + grupos().map(([g, l]) => '\n*' + g + '* (' + l.length + ')\n' +
    l.map(n => { const x = INFO[n] || {}; return n + (DUD.includes(n) ? ' (¿?)' : '') + (x.t ? ' · ' + diaTxt(x.t) + ' ' + hhmm(x.t) : ''); }).join('\n')).join('\n');
}
$('#compartir').onclick = async () => {
  if (!NUMS.length) return;
  const t = textoCompartir();
  if (navigator.share) { try { await navigator.share({ text: t }); } catch (_) {} return; }
  try { await navigator.clipboard.writeText(t); estado('✓ Copiado'); } catch (_) { prompt('Copiá:', t); }
};
$('#nueva').onclick = () => {
  if (NUMS.length && !confirm('¿Borrar TODA la lista de faltantes?\n\nSe borra en todos los celus (son ' + NUMS.length + ' para reclamar). Si solo llegó alguno, mejor tocá «✓ Llegó» en ese.')) return;
  NUMS = []; INFO = {}; FOTOS = []; DUD = []; PEND = { agregar: [], quitar: [], seguro: [] }; vaciarPend = true;
  guardar(); pintarFotos(); pintar(); estado(''); sincronizar();
};
function guardar() {
  DUD = DUD.filter(n => NUMS.includes(n));
  ls.set('flt-nums', NUMS); ls.set('flt-info', INFO); ls.set('flt-dud', DUD); ls.set('flt-agreg', AGREG);
  // las fotos ocupan: si no entran en el celu, se guardan solo las últimas
  let f = FOTOS.map(x => ({ src: x.src, n: x.n, ids: x.ids }));
  while (f.length) { try { localStorage.setItem('flt-fotos', JSON.stringify(f)); break; } catch (_) { f = f.slice(1); } }
}

/* ---------- instalar como app ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
let pedidoInstalar = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); pedidoInstalar = e; $('#instalar').hidden = false; });
window.addEventListener('appinstalled', () => { $('#instalar').hidden = true; });
$('#instalar').onclick = async () => { if (!pedidoInstalar) return; pedidoInstalar.prompt(); await pedidoInstalar.userChoice; pedidoInstalar = null; $('#instalar').hidden = true; };

FOTOS.forEach(f => { f.leyendo = false; });
if (!ls.get('flt-subido', false)) {
  if (NUMS.length) encolar('agregar', NUMS.map(id => ({ id, dud: DUD.includes(id) ? 1 : 0 })));
  ls.set('flt-subido', true);
}
pintarFotos(); pintar();
if (!clave()) pedirClave();
sincronizar();
if (NUMS.some(n => !(INFO[n] || {}).t) && clave()) buscar();
// al volver a la app y cada 15 s: trae lo que se borró/agregó en otro celu
document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(); });
setInterval(() => { if (!document.hidden) sincronizar(); }, 15000);
</script>
</body>
