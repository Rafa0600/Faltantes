<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe600">
<title>Faltantes</title>
<style>
  :root { --bg:#f2f3f5; --card:#fff; --tx:#1d1d1f; --mut:#6b7280; --bd:#e3e5e8; --az:#3483fa; --ok:#2e7d32; --mal:#c62828; --am:#ffe600; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { background:var(--am); padding:14px 16px; font-weight:700; font-size:20px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  header small { font-weight:400; font-size:13px; color:#555; margin-left:auto; }
  main { max-width:640px; margin:0 auto; padding:14px 16px 60px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .fila { display:flex; gap:8px; flex-wrap:wrap; }
  button, .btn { border:0; border-radius:10px; padding:12px 14px; font:600 16px system-ui,sans-serif; cursor:pointer; background:#eceef1; color:var(--tx); }
  .prim { background:var(--az); color:#fff; }
  .ok { background:var(--ok); color:#fff; }
  .grande { flex:1; min-width:140px; padding:16px 12px; font-size:17px; }
  textarea, input[type=text] { width:100%; border:1px solid var(--bd); border-radius:10px; padding:10px; font:16px system-ui,sans-serif; background:#fff; color:var(--tx); }
  textarea { min-height:70px; resize:vertical; }
  .mut { color:var(--mut); font-size:13px; }
  #estado { margin-top:10px; font-size:14px; }
  .barra { height:8px; background:#e5e7eb; border-radius:4px; overflow:hidden; margin-top:6px; display:none; }
  .barra div { height:100%; width:0; background:var(--az); transition:width .2s; }
  #foto { max-width:100%; max-height:220px; border-radius:10px; display:none; margin-top:10px; }
  .nums { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .num { display:flex; gap:6px; align-items:center; }
  .num input { flex:1; font:600 18px ui-monospace,Consolas,monospace; letter-spacing:.5px; padding:8px 10px; }
  .num input.malo { border-color:var(--mal); background:#fff3f3; }
  .num button { padding:8px 12px; }
  .res { border-top:1px solid var(--bd); padding:10px 0; display:flex; gap:10px; align-items:center; }
  .res:first-child { border-top:0; }
  .res .n { font:700 18px ui-monospace,Consolas,monospace; }
  .res .h { font-size:15px; }
  .res .p { margin-left:auto; color:#fff; font-weight:700; padding:5px 12px; border-radius:16px; white-space:nowrap; max-width:45%; overflow:hidden; text-overflow:ellipsis; }
  .res.no .h { color:var(--mal); }
  .grupo { font-weight:700; color:var(--mut); font-size:13px; margin:12px 0 2px; text-transform:uppercase; }
  details summary { cursor:pointer; color:var(--mut); font-size:14px; }
</style>
</head>
<body>
<header>📦 Faltantes <small id="nube">☁</small></header>
<main>
  <div class="card">
    <div class="fila">
      <label class="btn prim grande" style="text-align:center">📷 Sacar foto<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="btn grande" style="text-align:center">🖼 Elegir imagen<input id="gal" type="file" accept="image/*" hidden></label>
    </div>
    <div class="mut" style="margin-top:8px">Sacale foto a la pantalla «Detalle de faltantes» (o elegí la captura). También podés pegar los números abajo.</div>
    <img id="foto" alt="">
    <div class="barra" id="barra"><div></div></div>
    <div id="estado" class="mut"></div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;gap:8px"><b style="flex:1">Números de envío</b><span id="cuenta" class="mut"></span></div>
    <div class="nums" id="nums"></div>
    <div class="fila" style="margin-top:8px">
      <input type="text" id="nuevo" inputmode="numeric" placeholder="Agregar / pegar números…" style="flex:1">
      <button id="agregar">＋</button>
    </div>
    <div class="fila" style="margin-top:10px">
      <button class="prim grande" id="buscar">🔎 Buscar hora y proveedor</button>
      <button id="limpiar">🗑</button>
    </div>
  </div>

  <div class="card" id="resCard" style="display:none">
    <div style="display:flex;align-items:center;gap:8px"><b style="flex:1">Resultado</b>
      <button class="ok" id="compartir">📤 Compartir</button></div>
    <div id="res"></div>
  </div>

  <details class="card">
    <summary>⚙ Clave de la nube</summary>
    <div class="fila" style="margin-top:8px"><input type="text" id="clave" style="flex:1"><button id="guardarClave">Guardar</button></div>
    <div class="mut" style="margin-top:6px">La misma del Lector QR de Places (proveedores). Se pide una sola vez en cada celu.</div>
  </details>
</main>

<script>
const API = 'https://mikra-historial.rafaelassir.workers.dev/api/prov';
const CLAVE_DEF = '';   // el repo es público: la clave se pone una vez en cada celu (⚙ abajo)
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clave = () => ls.get('flt-clave', '') || CLAVE_DEF;
let NUMS = ls.get('flt-nums', []);
let ULT = ls.get('flt-res', null);

/* ---------- números ---------- */
function extraer(txt) {
  // corrige letras que el lector confunde dentro de números (O→0, l/I/|→1, S→5, B→8)
  const t = String(txt)
    .replace(/(?<=\d)[Oo]|[Oo](?=\d)/g, '0').replace(/(?<=\d)[lI|]|[lI|](?=\d)/g, '1')
    .replace(/(?<=\d)S|S(?=\d)/g, '5').replace(/(?<=\d)B|B(?=\d)/g, '8');
  const out = [];
  for (const m of t.matchAll(/\d[\d  .]{8,16}\d/g)) {
    const d = m[0].replace(/\D/g, '');
    if (d.length === 11) out.push(d);
    else if (d.length === 12) out.push(d.slice(1));      // el "#" de adelante leído como 7 / 4 / 1
    else if (d.length > 11 && d.length % 11 === 0) for (let i = 0; i < d.length; i += 11) out.push(d.slice(i, i + 11));
  }
  return out;
}
function agregar(lista) {
  let n = 0;
  for (const x of lista) if (!NUMS.includes(x)) { NUMS.push(x); n++; }
  ls.set('flt-nums', NUMS); pintarNums();
  return n;
}
function pintarNums() {
  $('#nums').innerHTML = NUMS.map((n, i) =>
    '<div class="num"><input data-i="' + i + '" value="' + n + '" inputmode="numeric" class="' + (/^\d{11}$/.test(n) ? '' : 'malo') + '">' +
    '<button data-x="' + i + '">✕</button></div>').join('') ||
    '<div class="mut">Todavía no hay números.</div>';
  $('#cuenta').textContent = NUMS.length ? NUMS.length + ' envío' + (NUMS.length === 1 ? '' : 's') : '';
}
$('#nums').addEventListener('input', (e) => {
  const i = e.target.dataset.i; if (i == null) return;
  NUMS[+i] = e.target.value.replace(/\D/g, '');
  e.target.classList.toggle('malo', !/^\d{11}$/.test(NUMS[+i]));
  ls.set('flt-nums', NUMS);
});
$('#nums').addEventListener('click', (e) => {
  const x = e.target.dataset.x; if (x == null) return;
  NUMS.splice(+x, 1); ls.set('flt-nums', NUMS); pintarNums();
});
function agregarDelCampo() {
  const v = $('#nuevo').value; if (!v.trim()) return;
  const l = extraer(v);
  if (!l.length) { estado('No veo números de 11 dígitos en eso.'); return; }
  agregar(l); $('#nuevo').value = '';
}
$('#agregar').onclick = agregarDelCampo;
$('#nuevo').addEventListener('keydown', (e) => { if (e.key === 'Enter') agregarDelCampo(); });
$('#nuevo').addEventListener('paste', () => setTimeout(agregarDelCampo, 0));
$('#limpiar').onclick = () => {
  if (NUMS.length && !confirm('¿Borrar la lista?')) return;
  NUMS = []; ULT = null; ls.set('flt-nums', NUMS); ls.set('flt-res', null);
  pintarNums(); $('#resCard').style.display = 'none'; $('#foto').style.display = 'none'; estado('');
};

/* ---------- foto → texto (Tesseract, en el mismo celu) ---------- */
function estado(t, pct) {
  $('#estado').textContent = t || '';
  $('#barra').style.display = pct == null ? 'none' : 'block';
  if (pct != null) $('#barra div').style.width = Math.round(pct * 100) + '%';
}
let tesseractListo = null;
function cargarTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (!tesseractListo) tesseractListo = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = res; s.onerror = () => { tesseractListo = null; rej(new Error('No se pudo cargar el lector (¿sin internet?)')); };
    document.head.appendChild(s);
  });
  return tesseractListo;
}
// agranda, pasa a gris y sube el contraste: con reflejos lee mucho mejor
function prepararImagen(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 2000, k = Math.min(1, max / Math.max(img.width, img.height)) * (Math.max(img.width, img.height) < 1200 ? 2 : 1);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d');
      g.filter = 'grayscale(1) contrast(1.6) brightness(1.05)';
      g.drawImage(img, 0, 0, c.width, c.height);
      res(c);
    };
    img.onerror = () => rej(new Error('No pude abrir la imagen'));
    img.src = URL.createObjectURL(file);
  });
}
async function leerFoto(file) {
  if (!file) return;
  $('#foto').src = URL.createObjectURL(file); $('#foto').style.display = 'block';
  try {
    estado('Cargando el lector… (la primera vez tarda un poco)', 0);
    await cargarTesseract();
    const canvas = await prepararImagen(file);
    const worker = await Tesseract.createWorker('eng', 1, {
      logger: (m) => { if (m.status === 'recognizing text') estado('Leyendo la foto…', m.progress); },
    });
    const { data } = await worker.recognize(canvas);
    await worker.terminate();
    const l = extraer(data.text);
    if (!l.length) { estado('⚠ No encontré números de 11 dígitos. Probá otra foto (más cerca, sin reflejo) o escribilos.'); return; }
    const n = agregar(l);
    estado('✓ Encontré ' + l.length + ' número' + (l.length === 1 ? '' : 's') + (n < l.length ? ' (' + (l.length - n) + ' ya estaban)' : '') + '. Revisalos con la foto y tocá Buscar.');
  } catch (e) { estado('⚠ ' + e.message); }
}
$('#cam').onchange = (e) => { leerFoto(e.target.files[0]); e.target.value = ''; };
$('#gal').onchange = (e) => { leerFoto(e.target.files[0]); e.target.value = ''; };

/* ---------- buscar en la nube ---------- */
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function hhmm(t) { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function diaTxt(t) {
  const d = new Date(t), h = new Date(); h.setHours(0, 0, 0, 0);
  const d0 = new Date(d); d0.setHours(0, 0, 0, 0);
  const n = Math.round((h - d0) / 86400000);
  return n === 0 ? 'Hoy' : n === 1 ? 'Ayer' : DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MES[d.getMonth()];
}
function colorProv(s) {
  let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return 'hsl(' + h + ',55%,40%)';
}
async function buscar() {
  const ids = NUMS.filter(n => /^\d{11}$/.test(n));
  if (!ids.length) { estado('Agregá al menos un número de 11 dígitos.'); return; }
  if (!clave()) {
    const k = prompt('Clave de la nube (la misma del Lector QR de Places):');
    if (!k) return;
    ls.set('flt-clave', k.trim()); $('#clave').value = k.trim();
  }
  if (ids.length < NUMS.length && !confirm('Hay números que no tienen 11 dígitos (en rojo). ¿Buscar igual los demás?')) return;
  $('#buscar').disabled = true; $('#buscar').textContent = 'Buscando…';
  try {
    const r = await fetch(API + '?ids=' + ids.join(','), { headers: { 'X-Clave': clave() } });
    if (r.status === 401) throw new Error('Clave incorrecta (⚙ abajo).');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'error');
    ULT = { t: Date.now(), ids, envios: j.envios };
    ls.set('flt-res', ULT);
    pintarRes();
    $('#nube').textContent = '☁ ✓';
  } catch (e) { estado('⚠ ' + (e.message === 'Failed to fetch' ? 'Sin conexión' : e.message)); $('#nube').textContent = '☁ ✕'; }
  finally { $('#buscar').disabled = false; $('#buscar').textContent = '🔎 Buscar hora y proveedor'; }
}
$('#buscar').onclick = buscar;

function filasOrdenadas() {
  return ULT.ids.map(id => ({ id, ...(ULT.envios[id] || {}) }))
    .sort((a, b) => (b.t || 0) - (a.t || 0));
}
function pintarRes() {
  if (!ULT) return;
  const f = filasOrdenadas();
  const enc = f.filter(x => x.t || x.prov), no = f.filter(x => !x.t && !x.prov);
  const fila = (x) => '<div class="res' + (x.t || x.prov ? '' : ' no') + '">' +
    '<div><div class="n">' + x.id + '</div><div class="h">' +
      (x.t ? '<b>' + diaTxt(x.t) + ' ' + hhmm(x.t) + '</b>' + (x.r && x.r < x.t - 60000 ? ' <span class="mut">(tanda desde ' + hhmm(x.r) + ')</span>' : '')
           : x.prov ? '<span class="mut">sin hora</span>' : 'No figura escaneado') +
    '</div></div>' +
    (x.prov ? '<span class="p" style="background:' + colorProv(x.prov) + '">' + esc(x.prov) + '</span>' : '') + '</div>';
  $('#res').innerHTML =
    '<div class="mut">' + enc.length + ' de ' + f.length + ' encontrados · ' + diaTxt(ULT.t) + ' ' + hhmm(ULT.t) + '</div>' +
    (enc.length ? enc.map(fila).join('') : '') +
    (no.length ? '<div class="grupo">No figuran (' + no.length + ')</div>' + no.map(fila).join('') +
      '<div class="mut" style="margin-top:6px">No pasaron por el Lector QR de la PC ni se vieron todavía en la página Stock.</div>' : '');
  $('#resCard').style.display = 'block';
  estado('');
}
function textoCompartir() {
  return '📦 Faltantes (' + ULT.ids.length + ')\n' + filasOrdenadas().map(x =>
    x.id + ' · ' + (x.t ? diaTxt(x.t) + ' ' + hhmm(x.t) : x.prov ? 'sin hora' : 'NO FIGURA') + (x.prov ? ' · ' + x.prov : '')).join('\n');
}
$('#compartir').onclick = async () => {
  const t = textoCompartir();
  if (navigator.share) { try { await navigator.share({ text: t }); return; } catch (_) { return; } }
  try { await navigator.clipboard.writeText(t); estado('✓ Copiado'); } catch (_) { prompt('Copiá:', t); }
};

/* ---------- clave ---------- */
$('#clave').value = ls.get('flt-clave', '') || CLAVE_DEF;
$('#guardarClave').onclick = () => { ls.set('flt-clave', $('#clave').value.trim()); estado('✓ Clave guardada'); };

pintarNums();
if (ULT) pintarRes();
</script>
</body>
</html>
